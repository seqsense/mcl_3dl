name: ros2 ci
on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read
  packages: read
  issues: write         # hiding bot comments
  pull-requests: write  # hiding bot comments

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - alpine-version: "3.23"
            ros-distro: jazzy
          - alpine-version: "3.23"
            ros-distro: humble
    uses: alpine-ros/alpine-ros-ci-workflows/.github/workflows/ros2.yaml@main
    with:
      alpine-version: ${{ matrix.alpine-version }}
      ros-distro: ${{ matrix.ros-distro }}
      enable-bot-comment: true
      # Shared with the ROS 1 job. sq_ros1_rclcpp_compat is a ROS 1-only
      # dependency: it gets checked out, but manifest-files below keeps it
      # out of the build.
      rosinstall-files: .rosinstall
      manifest-files: |
        package.xml
        ../../home/builder/extsrc/mcl_3dl_msgs/package.xml
    secrets:
      bot-comment-token: ${{ secrets.GITHUB_TOKEN }}
